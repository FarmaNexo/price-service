environment: development

server:
  host: 0.0.0.0
  port: 4005
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s

database:
  host: "${DB_HOST}"
  port: 5432
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  db_name: price_db
  schema: price
  sslmode: require
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

jwt:
  secret: "${JWT_SECRET}"
  access_token_duration: 15m
  issuer: "farmanexo-price-service"

redis:
  host: "${REDIS_HOST}"
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0
  max_retries: 3
  pool_size: 10

aws:
  region: "${AWS_REGION}"
  endpoint: ""

sqs:
  price_events_queue_url: "${SQS_PRICE_EVENTS_QUEUE_URL}"
  pharmacy_events_queue_url: "${SQS_PHARMACY_EVENTS_QUEUE_URL}"

services:
  pharmacy_service:
    base_url: "${PHARMACY_SERVICE_URL}"
  catalog_service:
    base_url: "${CATALOG_SERVICE_URL}"

consumer:
  enabled: true
  poll_interval: 5s
  max_messages: 10
  visibility_timeout: 30

log:
  level: info
  encoding: json
